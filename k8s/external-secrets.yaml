---
# Service Account with IAM Role for Secrets Manager Access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tribetalk-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::430006376054:role/tribetalk-secrets-access-role
---
# External Secrets Operator - SecretStore
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: tribetalk-sa
---
# External Secret for Database Credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: tribetalk-database-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tribetalk/database/credentials
---
# External Secret for Application Config
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: tribetalk-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tribetalk/app/config
