# Lightweight Grafana Stack Configuration for Small EKS Cluster
# Optimized for clusters with limited resources

grafana:
  enabled: true
  
  # Admin credentials
  adminPassword: "admin123"  # TODO: Change this in production!
  
  # Use NodePort instead of LoadBalancer to avoid AWS LB costs and permission issues
  service:
    type: NodePort
    nodePort: 30300
  
  # Disable persistence to avoid PVC issues
  persistence:
    enabled: false
  
  # Minimal resource limits
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

prometheus:
  enabled: true
  
  prometheusSpec:
    # Shorter retention for less storage
    retention: 7d
    
    # Disable persistence to avoid PVC issues
    storageSpec: {}
    
    # Much lower resource limits
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 500m
    
    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  # Disable AlertManager to save resources
  enabled: false

# Prometheus Operator configuration
prometheusOperator:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# Node Exporter - lightweight
nodeExporter:
  enabled: true
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m

# Kube State Metrics
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 100m

# Minimal default rules
defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeApiserver: false
    kubePrometheusNodeRecording: true
    kubernetesResources: true
    kubernetesStorage: false
    kubernetesSystem: true
    node: true
