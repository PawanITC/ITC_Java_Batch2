# Minimal Loki configuration for small cluster
# Single instance mode with no persistence

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
  
  storage:
    type: 'filesystem'
  
  # Disable ruler to avoid filesystem errors
  rulerConfig:
    enable_api: false
    storage:
      type: local
      local:
        directory: /tmp/rules
  
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  
  # Use emptyDir for temporary writable storage
  persistence:
    enabled: false
  
  # Minimal resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Disable gateway (not needed for single instance)
gateway:
  enabled: false

# Disable read/write/backend (using SingleBinary mode)
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Disable canary (testing component)
lokiCanary:
  enabled: false

# Disable caches to save pods
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Monitoring integration
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# Retention configuration
limits_config:
  retention_period: 168h  # 7 days (matches Prometheus)
  max_query_length: 721h  # Allow querying full retention period

# Test configuration
test:
  enabled: false
