version: '3.8'
networks:
  monitoring:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:latest  # Updated to latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./data/prometheus/config:/etc/prometheus/
      - ./data/prometheus/data:/prometheus  # Add data persistence
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"  # Explicit data path
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest  # Updated to latest
    container_name: grafana
    restart: unless-stopped
    user: 472  # Non-root user for security
    networks:
      - monitoring
    volumes:
      - ./data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}  # Use env var or secret
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=your-domain.com  # Set for production
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info  # Less verbose than debug
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Add your Spring Boot app as a service
  spring-app:
    image: your-spring-app:latest  # Build your app into a Docker image
    networks:
      - monitoring
    ports:
      - "8080:8080"
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus