#existingclientid     - Ov23liGm8fihan8YBuCU
frontend:
  url: http://localhost:5173


server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg [traceId=%X{trace_id}] [spanId=%X{span_id}] [requestId=%X{request_id}] [user=%X{user}]%n"

jwt:
  secret: change_this_to_a_long_random_secret_with_min_256_bits
  expirationMillis: 3600000

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
  logs:
    exporter: none
  traces:
    exporter: otlp
  service:
    name: tribetalk

management:
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    include: health, info, metrics, prometheus
    prometheus:
      enabled: false
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: false
    distribution:
      percentiles-histogram:
        http.server.requests: false
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: false

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


app:
  url: http://localhost:5173
