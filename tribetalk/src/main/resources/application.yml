spring:
  application:
    name: tribetalk

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  redis:
    host: redis
    port: 6379

  cache:
    type: redis

  datasource:
    url: jdbc:postgresql://localhost:5432/tribetalk
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin123

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update        # or 'none' / 'validate' / 'create' depending on your setup
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

#  h2:
#    console:
