# Jenkins Configuration as Code (JCasC)
jenkins:
  systemMessage: "TribeTalk CI/CD Server"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 3
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - aws:
              accessKey: "${AWS_ACCESS_KEY_ID}"
              description: "AWS Credentials for ECR and EKS"
              id: "aws-credentials"
              scope: GLOBAL
              secretKey: "${AWS_SECRET_ACCESS_KEY}"

unclassified:
  location:
    url: "http://${JENKINS_URL}:8080/"
  
  globalLibraries:
    libraries:
      - name: "tribetalk-shared-library"
        defaultVersion: "main"
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/your-org/tribetalk-jenkins-library.git"

jobs:
  - script: >
      folder('TribeTalk') {
        description('TribeTalk Microservices Pipelines')
      }
  
  - script: >
      pipelineJob('TribeTalk/tribetalk-service') {
        description('Build and deploy TribeTalk service')
        parameters {
          stringParam('IMAGE_TAG', 'latest', 'Docker image tag')
          booleanParam('DEPLOY_TO_EKS', true, 'Deploy to EKS')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/your-org/tribetalk.git')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }
  
  - script: >
      pipelineJob('TribeTalk/chatservice') {
        description('Build and deploy ChatService')
        parameters {
          stringParam('IMAGE_TAG', 'latest', 'Docker image tag')
          booleanParam('DEPLOY_TO_EKS', true, 'Deploy to EKS')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/your-org/tribetalk.git')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }
  
  - script: >
      pipelineJob('TribeTalk/notification-service') {
        description('Build and deploy Notification Service')
        parameters {
          stringParam('IMAGE_TAG', 'latest', 'Docker image tag')
          booleanParam('DEPLOY_TO_EKS', true, 'Deploy to EKS')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/your-org/tribetalk.git')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }
