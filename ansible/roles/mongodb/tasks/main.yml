---
- name: Setup MongoDB Database
  hosts: ansible_mongodb
  become: yes
  vars:
    mongodb_version: "7.0"
    db_name: "tribetalknosqldb"
    db_user: "admin"
    db_password: "{{ lookup('env', 'DB_PASSWORD') | default('admin123', true) }}"
    
  tasks:
    - name: Install dependencies
      apt:
        name:
          - gnupg
          - curl
          - python3-pip
        state: present
        update_cache: yes

    - name: Install pymongo via pip
      pip:
        name: pymongo>=4.0
        state: present
        executable: pip3

    - name: Add MongoDB GPG key
      apt_key:
        url: https://www.mongodb.org/static/pgp/server-{{ mongodb_version }}.asc
        state: present

    - name: Add MongoDB repository
      apt_repository:
        repo: "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/{{ mongodb_version }} multiverse"
        state: present
        filename: mongodb-org-{{ mongodb_version }}

    - name: Install MongoDB
      apt:
        name:
          - mongodb-org
        state: present
        update_cache: yes

    - name: Create MongoDB data directory
      file:
        path: /var/lib/mongodb
        state: directory
        owner: mongodb
        group: mongodb
        mode: '0755'

    - name: Configure MongoDB to listen on all interfaces
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^  bindIp:'
        line: '  bindIp: 0.0.0.0'
      notify: restart mongodb

    - name: Remove security section
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^security:'
        state: absent
      notify: restart mongodb

    - name: Disable MongoDB authorization temporarily
      lineinfile:
        path: /etc/mongod.conf
        regexp: '  authorization: enabled'
        state: absent
      notify: restart mongodb

    # Force restart to apply disabled auth immediately
    - name: Restart MongoDB to disable auth
      systemd:
        name: mongod
        state: restarted

    - name: Start MongoDB without auth first
      systemd:
        name: mongod
        state: started
        enabled: yes

    - name: Wait for MongoDB to start
      wait_for:
        port: 27017
        delay: 5
        timeout: 30

    - name: Create MongoDB admin user
      mongodb_user:
        login_port: 27017
        database: admin
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        roles:
          - { db: "admin", role: "userAdminAnyDatabase" }
          - { db: "admin", role: "readWriteAnyDatabase" }
          - { db: "admin", role: "dbAdminAnyDatabase" }
        state: present

        state: present

    - name: Enable MongoDB security section
      lineinfile:
        path: /etc/mongod.conf
        line: 'security:'
      notify: restart mongodb

    - name: Enable MongoDB authorization
      lineinfile:
        path: /etc/mongod.conf
        insertafter: '^security:'
        line: '  authorization: enabled'
      notify: restart mongodb

    - name: Restart MongoDB to enable auth
      systemd:
        name: mongod
        state: restarted

    - name: Create application database
      mongodb_user:
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        login_port: 27017
        database: "{{ db_name }}"
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        roles:
          - { db: "{{ db_name }}", role: "readWrite" }
        state: present

  handlers:
    - name: restart mongodb
      systemd:
        name: mongod
        state: restarted
