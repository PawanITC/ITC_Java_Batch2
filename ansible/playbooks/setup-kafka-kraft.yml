---
- name: Setup Kafka KRaft Cluster
  hosts: ansible_kafka
  become: yes
  vars:
    kafka_version: "3.6.1"
    kafka_scala_version: "2.13"
    kafka_home: "/opt/kafka"
    kafka_data_dir: "/var/lib/kafka"
    kafka_log_dir: "/var/log/kafka"
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Java 17
      apt:
        name: openjdk-17-jdk-headless
        state: present

    - name: Create Kafka user
      user:
        name: kafka
        system: yes
        shell: /bin/false
        home: "{{ kafka_home }}"

    - name: Create Kafka directories
      file:
        path: "{{ item }}"
        state: directory
        owner: kafka
        group: kafka
        mode: '0755'
      loop:
        - "{{ kafka_home }}"
        - "{{ kafka_data_dir }}"
        - "{{ kafka_log_dir }}"

    - name: Download Kafka
      get_url:
        url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
        dest: "/tmp/kafka.tgz"
        mode: '0644'

    - name: Extract Kafka
      unarchive:
        src: "/tmp/kafka.tgz"
        dest: "{{ kafka_home }}"
        remote_src: yes
        extra_opts: [--strip-components=1]
        owner: kafka
        group: kafka

    - name: Generate Kafka cluster UUID (run on first node only)
      shell: "{{ kafka_home }}/bin/kafka-storage.sh random-uuid"
      register: cluster_uuid
      run_once: yes
      delegate_to: "{{ groups['ansible_kafka'][0] }}"

    - name: Set cluster UUID fact
      set_fact:
        kafka_cluster_uuid: "{{ hostvars[groups['ansible_kafka'][0]]['cluster_uuid'].stdout }}"

    - name: Get node ID from EC2 tags
      set_fact:
        kafka_node_id: "{{ hostvars[inventory_hostname]['tags']['NodeId'] }}"

    - name: Create server.properties from template
      template:
        src: ../roles/kafka-kraft/templates/server.properties.j2
        dest: "{{ kafka_home }}/config/kraft/server.properties"
        owner: kafka
        group: kafka
        mode: '0644'

    - name: Format Kafka storage
      shell: "{{ kafka_home }}/bin/kafka-storage.sh format -t {{ kafka_cluster_uuid }} -c {{ kafka_home }}/config/kraft/server.properties"
      args:
        creates: "{{ kafka_data_dir }}/meta.properties"
      become_user: kafka

    - name: Create Kafka systemd service
      template:
        src: ../roles/kafka-kraft/templates/kafka.service.j2
        dest: /etc/systemd/system/kafka.service
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable Kafka
      systemd:
        name: kafka
        state: started
        enabled: yes

    - name: Wait for Kafka to start
      wait_for:
        port: 9092
        delay: 10
        timeout: 60

    - name: Verify Kafka cluster
      shell: "{{ kafka_home }}/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
      register: kafka_status
      changed_when: false

    - name: Display Kafka status
      debug:
        var: kafka_status.stdout_lines
