spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/tribetalknosqldb?authSource=admin


  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.learning.notification_service.dto"   # <-- your package containing NotificationEvent
        spring.json.value.default.type: com.learning.notification_service.dto.NotificationDTO
    admin:
      auto-create: true
server:
  port: 8082